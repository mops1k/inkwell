name: Release

# Publishing rule:
#   * a tag like 0.2.0 (no "v" prefix) builds the release image and publishes a
#     GitHub Release with the board images, firmware-manifest.json, SHA256SUMS
#     and the debug artifacts (bootloader/partitions/elf/map);
#   * a manual run does the same for a version typed into the form, and can create
#     the tag itself when it does not exist yet.
#
# The device installs an update only when firmware-manifest.json names the asset
# it downloads for its board and the streamed SHA-256 matches (see
# src/network/OtaUpdater.cpp), so the manifest step is part of the release gate.
#
# The version string is injected through CROSSPOINT_RELEASE_VERSION, which
# scripts/git_branch.py reads for the gh_release environment — the same mechanism
# the local release builds use, so the image shows the published version.

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without prefix, e.g. 0.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: false
        default: false
        type: boolean
      hardware_tested:
        description: "Set hardware_tested in firmware-manifest.json (image already runs on a real X3/X4)"
        required: false
        default: false
        type: boolean
      create_tag:
        description: "Create and push the tag if it does not exist"
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PLATFORMIO_VERSION: "6.2.0"
  PYTHON_VERSION: "3.11"

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (full history, with submodules)
        uses: actions/checkout@v4
        with:
          # Release notes compare the new tag against the previous published
          # release, so the whole history and all tags are needed.
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version '$VERSION' is not X.Y.Z or X.Y.Z-suffix"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing Inkwell $VERSION"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-${{ hashFiles('platformio.ini', 'inkwell.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ env.PLATFORMIO_VERSION }}-

      - name: Install PlatformIO
        run: pip install "platformio==${PLATFORMIO_VERSION}"

      - name: Generate i18n headers
        run: python3 scripts/gen_i18n.py lib/I18n/translations lib/I18n/

      - name: Build release firmware
        env:
          # Read by scripts/git_branch.py for the gh_release environment.
          CROSSPOINT_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pio run -e gh_release

      - name: Collect release assets and checksum
        id: assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUILD=.pio/build/gh_release
          IMAGE="${BUILD}/firmware.bin"
          test -s "$IMAGE"
          mkdir -p dist

          # One image for X3 and X4: both FreeInk profiles are compiled in and the
          # board is detected at runtime, so the model-named files upstream ships
          # are aliases of the same bytes. `firmware.bin` keeps tooling that
          # expects the upstream name working.
          cp "$IMAGE" "dist/inkwell-${VERSION}.bin"
          cp "$IMAGE" "dist/firmware.bin"
          cp "$IMAGE" "dist/firmware-x3.bin"
          cp "$IMAGE" "dist/firmware-x4.bin"

          # Debug/verification artifacts, same set as upstream publishes.
          for artifact in bootloader.bin partitions.bin firmware.elf firmware.map; do
            test -s "${BUILD}/${artifact}"
            cp "${BUILD}/${artifact}" "dist/${artifact}"
          done

          (cd dist && sha256sum ./*.bin > SHA256SUMS)
          cat dist/SHA256SUMS
          echo "image=dist/inkwell-${VERSION}.bin" >> "$GITHUB_OUTPUT"
          echo "sums=dist/SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Generate firmware manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HARDWARE_TESTED: ${{ inputs.hardware_tested && 'true' || 'false' }}
        run: |
          set -euo pipefail
          # Verifies SHA256SUMS against the files and aborts the release on any
          # mismatch, so a published manifest always matches the published bytes.
          python3 scripts/generate_manifest.py \
            --dist dist \
            --version "${VERSION}" \
            --source-commit "$(git rev-parse HEAD)" \
            --devices X3 X4 \
            --hardware-tested "${HARDWARE_TESTED}"
          cat dist/firmware-manifest.json

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          SCOPE="full"
          if [ "${PRERELEASE:-false}" = "true" ]; then
            SCOPE="any"
          fi
          python3 scripts/generate_release_notes.py \
            --output release-notes.md \
            --target-sha "$(git rev-parse HEAD)" \
            --current-label "${VERSION}" \
            --release-scope "$SCOPE" \
            --exclude-tag "${VERSION}" || {
              printf 'Release %s\n' "${VERSION}" > release-notes.md
            }
          cat release-notes.md

      - name: Create tag (manual run only)
        if: github.event_name == 'workflow_dispatch' && inputs.create_tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "tag ${VERSION} already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" -m "Inkwell ${VERSION}"
            git push origin "refs/tags/${VERSION}"
          fi

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          FLAGS=(--title "Inkwell ${VERSION}" --notes-file release-notes.md)
          if [ "${PRERELEASE:-false}" = "true" ]; then
            FLAGS+=(--prerelease)
          fi
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" dist/* --clobber
            gh release edit "${VERSION}" "${FLAGS[@]}"
          else
            gh release create "${VERSION}" dist/* "${FLAGS[@]}"
          fi
